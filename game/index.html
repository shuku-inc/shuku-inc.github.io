<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>AREA 1 - きょうりゅうアドベンチャー</title>
<style>
  /* =========================================================
     見た目のスタイル。色を変えたいときはここをいじってね！
  ========================================================= */
  :root{
    --bg-deep:#182b18;
    --panel:#22351f;
    --accent:#ffb347;
    --accent2:#e8722c;
    --line:#4a6b3a;
  }
  *{ box-sizing:border-box; }
  html,body{
    margin:0; padding:0; width:100%; height:100%;
    background:var(--bg-deep);
    color:#fff;
    font-family:"Courier New", "MS Gothic", monospace;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    touch-action:none;
    user-select:none;
  }
  #app{
    display:flex; flex-direction:column; align-items:center;
    gap:10px; width:100%; max-width:980px; padding:10px;
  }
  h1{
    margin:0; font-size:18px; letter-spacing:2px;
    color:var(--accent);
    text-shadow:2px 2px 0 #000;
  }
  #stage{
    position:relative;
    width:100%;
    max-width:960px;
    aspect-ratio:960/540;
    border:6px solid var(--line);
    box-shadow:0 0 0 4px #000, 0 10px 30px rgba(0,0,0,.6);
    background:#241b4e;
    image-rendering:pixelated;
  }
  canvas{
    position:absolute; top:0; left:0;
    width:100%; height:100%;
    display:block;
  }
  .overlay{
    position:absolute; inset:0;
    display:flex; flex-direction:column; align-items:center; justify-content:center;
    gap:16px;
    background:rgba(11,15,44,.88);
    text-align:center;
    padding:20px;
  }
  .hidden{ display:none !important; }
  .overlay h2{
    /* 画面幅に応じて自動で縮む可変フォントサイズ。狭い画面で不格好に2行折り返すのを防ぐ */
    font-size:clamp(16px, 6vw, 28px);
    margin:0; color:var(--accent);
    text-shadow:3px 3px 0 #000;
    white-space:nowrap;
  }
  .overlay p{ margin:0; font-size:13px; line-height:1.8; color:#cfd4ff; }
  .btn{
    font-family:inherit;
    font-size:16px;
    padding:12px 28px;
    background:var(--accent2);
    color:#fff;
    border:none;
    box-shadow:0 6px 0 #a34d16, 0 6px 12px rgba(0,0,0,.5);
    cursor:pointer;
    letter-spacing:2px;
  }
  .btn:active{
    transform:translateY(4px);
    box-shadow:0 2px 0 #a34d16;
  }
  #controls{
    display:flex; justify-content:space-between; width:100%; max-width:960px;
  }
  .padGroup{ display:flex; gap:10px; }
  .padBtn{
    width:64px; height:56px;
    background:var(--panel);
    border:3px solid var(--line);
    color:#fff; font-size:20px;
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 4px 0 #000;
  }
  .padBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 #000; }
  #hint{ font-size:11px; color:#8a91c4; letter-spacing:1px; }

  /* タッチ操作専用の操作バー。ゲーム画面(#stage)の「下」に専用の帯として
     常に確保しておき、恐竜や地面が描かれるゲーム画面とは重ならない、
     常にはっきり見える場所にコントローラーを配置する。
     (以前はcanvasの上に半透明で重ねていたが、横画面時に地面と被って
     見えにくいという指摘があったため、専用スペースに変更した) */
  #touchControlsBar{
    display:flex; align-items:center; justify-content:space-between;
    width:100%; max-width:960px; height:96px; /* JS側のBAR_H定数と合わせること */
    padding:0 18px;
    background:var(--panel);
    border:3px solid var(--line);
    border-top:none;
  }

  /* 移動用の仮想スティック。バー内の決まった位置に常に円が見えている状態にし、
     指を置くとその場で操作でき、指の動きに合わせてノブ(中の丸)だけが動く。
     大きさはジャンプ/ファイヤーボタン(.actionBtn)と統一(66px)。 */
  #touchStickZone{
    position:relative; width:88px; height:88px;
    display:flex; align-items:center; justify-content:center;
  }
  #touchStick{
    position:relative; width:66px; height:66px;
    border-radius:50%;
    border:3px solid rgba(255,255,255,.55);
    background:rgba(0,0,0,.25);
    pointer-events:none; /* 触っても反応させない(タッチはtouchStickZone側で拾う) */
  }
  #touchStick .knob{
    position:absolute; left:50%; top:50%;
    width:28px; height:28px;
    margin-left:-14px; margin-top:-14px;
    border-radius:50%;
    background:rgba(255,255,255,.75);
    transition:transform .08s ease;
  }

  /* ジャンプ／ファイヤーブレスの操作ボタン(スマホ用)。バー内の右側にまとめて
     配置し、色とアイコンをはっきり分けてどちらのボタンか一目でわかるようにする。 */
  #touchActions{
    display:flex; align-items:center; gap:14px;
  }
  .actionBtn{
    width:66px; height:66px; border-radius:50%;
    display:flex; align-items:center; justify-content:center;
    font-size:26px; color:#fff;
    background:rgba(34,53,31,.8);
    border:3px solid rgba(255,255,255,.55);
    box-shadow:0 4px 0 rgba(0,0,0,.5);
    user-select:none;
  }
  .actionBtn:active{ transform:translateY(3px); box-shadow:0 1px 0 rgba(0,0,0,.5); }
  .actionBtn.fire{
    background:rgba(232,114,44,.85);
    border-color:rgba(255,204,140,.85);
  }

  /* 全画面表示の切り替えボタン(YouTubeのようにゲーム画面の隅に置く) */
  #fsBtn{
    position:absolute; top:8px; right:8px; z-index:60;
    width:34px; height:34px; border-radius:8px;
    display:flex; align-items:center; justify-content:center;
    background:rgba(0,0,0,.5); color:#fff;
    border:2px solid rgba(255,255,255,.55);
    font-size:16px; line-height:1;
    font-family:inherit; cursor:pointer; padding:0;
  }
  #fsBtn:active{ transform:translateY(1px); }

  /* スマホ幅では見出しを消して、その分ゲーム画面(#stage)を大きく表示する。
     横画面(幅が640pxを超える)でも同じ調整が必要なため、幅だけでなく
     タッチ端末かどうか(html.touch-ui、JS側で付与)でも判定する。 */
  @media (max-width:640px){
    h1{ display:none; }
    #app{ padding:4px; gap:6px; }
    .overlay{ padding:14px; }
  }
  html.touch-ui h1{ display:none; }
  html.touch-ui #app{ padding:4px; gap:6px; }
  html.touch-ui .overlay{ padding:14px; }

  /* 全画面表示になったとき、端末が縦向きのままなら(=iOS等で画面回転ロックが
     使えない場合)、CSSの回転で疑似的に横画面表示にする。
     Androidなど画面回転ロックに対応している場合は実際に横向きになるため、
     その場合はこのmedia queryの条件(縦向き)自体が成立せず適用されない。 */
  @media (orientation:portrait){
    html:fullscreen #app, html:-webkit-full-screen #app,
    html.pseudo-fullscreen #app{
      position:fixed; top:0; left:100%;
      width:100vh; height:100vw;
      max-width:none;
      transform-origin:0 0;
      transform:rotate(90deg);
    }
  }
</style>
</head>
<body>
<div id="app">
  <h1>★ きょうりゅうの島 ★</h1>
  <div id="stage">
    <canvas id="game" width="960" height="540"></canvas>
    <button type="button" id="fsBtn" title="全画面表示">⛶</button>

    <div id="titleScreen" class="overlay">
      <h2>きょうりゅうアドベンチャー</h2>
      <p id="titleHint">← → で うごく　　↑ / SPACE で ジャンプ<br>ENTER で ファイヤーブレス！　てきの宇宙人をふんでやっつけろ！　たまごの巣にタッチでゴール！</p>
      <button class="btn" id="startBtn">スタート</button>
    </div>

    <div id="deadScreen" class="overlay hidden">
      <h2>GAME OVER</h2>
      <p id="deadScore"></p>
      <button class="btn" id="retryBtn">もういちど</button>
    </div>

    <div id="clearScreen" class="overlay hidden">
      <h2>STAGE CLEAR!</h2>
      <p id="clearScore"></p>
      <button class="btn" id="againBtn">もういちど あそぶ</button>
    </div>
  </div>

  <!-- タッチ操作専用の操作バー。ゲーム画面(#stage)の下に専用の帯として確保し、
       恐竜や地面と重ならない、常にはっきり見える場所にコントローラーを置く。 -->
  <div id="touchControlsBar" class="hidden">
    <div id="touchStickZone">
      <div id="touchStick"><div class="knob"></div></div>
    </div>
    <div id="touchActions">
      <div class="actionBtn fire hidden" id="btnFireTouch" title="ファイヤーブレス">🔥</div>
      <div class="actionBtn" id="btnJumpTouch" title="ジャンプ">⤴</div>
    </div>
  </div>

  <div id="controls">
    <div class="padGroup">
      <div class="padBtn" id="btnLeft">◀</div>
      <div class="padBtn" id="btnRight">▶</div>
    </div>
    <div class="padGroup">
      <div class="padBtn" id="btnJump">⤴</div>
    </div>
  </div>
  <div id="hint">キーボード：← → で移動 / SPACE か ↑ でジャンプ / ENTER で攻撃 / R でリトライ</div>
</div>

<script>
/* =============================================================
   ここから先がゲーム本体のプログラムです。
   改造したいときは、まず下の「CONFIG」「LEVEL」あたりを
   さわってみるのがオススメ！（変更が結果に出やすい場所です）
============================================================= */

const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const VW = canvas.width, VH = canvas.height; // 画面サイズ(内部解像度)

/* ---------------------------------------------------------------
   ▼▼▼ CONFIG：物理・プレイヤーの基本パラメータ（いじって遊びやすい）▼▼▼
--------------------------------------------------------------- */
const CONFIG = {
  GRAVITY: 0.7,          // 落下の重さ。上げると「ふんわり」感が減りキビキビ落ちる
  MAX_FALL_SPEED: 15,
  MOVE_ACCEL: 0.6,
  MOVE_MAX: 4.6,
  FRICTION: 0.75,
  JUMP_POWER: 15,         // ジャンプの初速。大きいほど高く跳べる(以前は12.2)
  PLAYER_LIVES: 3,
  TIME_LIMIT: 200,       // 秒
  GROUND_Y: 460,         // 地面の表面のy座標
  WORLD_WIDTH: 4400,      // ステージの横幅
};

/* ---------------------------------------------------------------
   ▼▼▼ COLORS：配色パレット。ここを変えると雰囲気がガラッと変わる ▼▼▼
--------------------------------------------------------------- */
const COLORS = {
  skyTop: '#5cc4e8',
  skyBottom: '#ffe2a6',
  hill: '#2d6a4f',
  hillDark: '#1b4332',
  ground: '#7a5230',
  groundTop: '#7cb342',
  block: '#9c8368',
  blockLine: '#5c4a3a',
  question: '#d9c9a3',
  questionUsed: '#9c8f76',
  pipe: '#8a6440',
  pipeDark: '#5c3f26',
  player: '#5fb85a',
  playerCap: '#3f8f3f',
  playerFire: '#ff9a3c',
  playerFireCap: '#e8722c',
  playerSkin: '#f4e0a0',
  enemy: '#b490e0',
  coin: '#e0a458',
  goalPole: '#8a6440',
  goalCore: '#ffb347',
  volcano: '#6b4a3a',
  volcanoDark: '#4a3226',
  lava: '#ff6b35',
  cloud: 'rgba(255,255,255,0.85)',
};

/* ---------------------------------------------------------------
   ▼▼▼ LEVEL：ステージのデータ。数値をいじるだけで配置が変わる ▼▼▼
--------------------------------------------------------------- */
const LEVEL = {
  // 地面がある区間 [x1, x2]。区間の切れ目は「穴」になる
  groundSegments: [
    [0, 900],
    [1050, 3326],
    [3400, 4400],
  ],
  // 浮いているブロック { x, y, type: 'question' | 'brick', coin: true/false }
  blocks: [
    { x: 340, y: 300, type: 'question', coin: true },
    { x: 380, y: 300, type: 'brick', coin: false },
    { x: 420, y: 300, type: 'question', coin: true },
    { x: 460, y: 300, type: 'question', coin: true },

    { x: 1180, y: 260, type: 'question', coin: false, item: 'fire' },

    { x: 1900, y: 300, type: 'brick', coin: false },
    { x: 1940, y: 300, type: 'question', coin: true },
    { x: 1980, y: 300, type: 'brick', coin: false },

    { x: 2370, y: 260, type: 'question', coin: true },
    { x: 2410, y: 260, type: 'brick', coin: false },
    { x: 2450, y: 260, type: 'question', coin: true },
    { x: 2490, y: 260, type: 'question', coin: true },

    { x: 3600, y: 300, type: 'question', coin: true },
    { x: 3640, y: 300, type: 'brick', coin: false },
    { x: 3680, y: 300, type: 'question', coin: true },
  ],
  // 土管 { x, w, h }（groundY を基準に高さぶん上に伸びる）
  pipes: [
    { x: 640, w: 64, h: 60 },
    { x: 1300, w: 70, h: 110 },
    { x: 2000, w: 64, h: 60 },
    { x: 2500, w: 64, h: 80 },
  ],
  // 敵 { x, left, right, y? } 左右の範囲を往復する
  enemies: [
    { x: 760, left: 720, right: 880 },
    { x: 1160, left: 1100, right: 1280 },
    { x: 1750, left: 1680, right: 1980 },
    { x: 2450, left: 2380, right: 2650 },
    { x: 3690, left: 3660, right: 3780 },
  ],
  // 地面に置く単体コイン { x, y }
  coins: [
    { x: 600, y: 380 }, { x: 630, y: 380 },
    { x: 1450, y: 380 }, { x: 1480, y: 380 }, { x: 1510, y: 380 },
    { x: 2150, y: 380 }, { x: 2180, y: 380 },
    { x: 2550, y: 380 }, { x: 2580, y: 380 },
    { x: 3650, y: 380 }, { x: 3680, y: 380 }, { x: 3710, y: 380 },
  ],
  // 階段（ゴール前の段差） 段の数と1段の幅・高さ
  stairs: {
    startX: 2750,
    stepW: 48,
    stepH: 40,
    steps: 6, // 6段登って降りる
  },
  flagX: 4300, // ゴールの旗の位置（階段を降りきった先の平地に配置）
};

/* ---------------------------------------------------------------
   効果音（外部ファイル無し・WebAudioで生成する「きょうりゅうっぽい」音）
   beep = 単純な一音、growl = 周波数が滑らかに変化する咆哮・鳴き声用
--------------------------------------------------------------- */
let audioCtx = null;
function beep(freq, duration, type='square', gain=0.12, delay=0){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freq, t0);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + duration);
}
// 周波数が freqFrom → freqTo へスライドする音（鳴き声・咆哮・地響きに使う）
function growl(freqFrom, freqTo, duration, type='sawtooth', gain=0.14, delay=0){
  if(!audioCtx) return;
  const t0 = audioCtx.currentTime + delay;
  const osc = audioCtx.createOscillator();
  const g = audioCtx.createGain();
  osc.type = type;
  osc.frequency.setValueAtTime(freqFrom, t0);
  osc.frequency.exponentialRampToValueAtTime(Math.max(30,freqTo), t0 + duration);
  g.gain.setValueAtTime(gain, t0);
  g.gain.exponentialRampToValueAtTime(0.001, t0 + duration);
  osc.connect(g); g.connect(audioCtx.destination);
  osc.start(t0); osc.stop(t0 + duration);
}
const sfx = {
  // ぴょこっと跳ねる「キュイッ」という鳴き声（音程が少し上がる）
  jump: ()=> growl(320, 520, 0.12, 'triangle', 0.10),
  // 「たまご」を見つけたときの、うれしそうな2音の鳴き声
  coin: ()=> { beep(740, 0.07,'sine',0.10); beep(880, 0.10,'sine',0.10,0.05); },
  // てきを踏んづけたときの「ガブッ」という低い噛みつき音
  stomp: ()=> growl(260, 90, 0.13, 'square', 0.16),
  // ブロックに頭をぶつけたときの「ドスッ」という鈍い音
  bump: ()=> growl(180, 120, 0.10, 'triangle', 0.12),
  // 口から火を吐くときの「ゴアアァ！」という低い咆哮＋炎の「シュー」音
  fire: ()=> { growl(150, 60, 0.22, 'sawtooth', 0.16); beep(1400, 0.15, 'sine', 0.05, 0.03); },
  // やられたときの「クゥーン…」というしょんぼり鳴き声（音程が下がる）
  die: ()=> { growl(300, 90, 0.35, 'sawtooth', 0.14); growl(200, 60, 0.4, 'triangle', 0.10, 0.15); },
  // ゴールしたときの、誇らしげな「ウォオオーッ！」という雄叫び
  clear: ()=> { growl(220, 700, 0.5, 'sawtooth', 0.14); [587,740,880,1174].forEach((f,i)=>beep(f,0.18,'triangle',0.10,0.4+i*0.15)); },
};

/* ---------------------------------------------------------------
   ステート
--------------------------------------------------------------- */
let state = 'title'; // title | playing | dead | clear
let camX = 0;
let shake = 0;
let elapsedTime = 0;
let lastTimestamp = 0;
let floatingTexts = []; // { x,y,text,life }

const input = { left:false, right:false, jump:false, jumpHeld:false, attack:false, attackHeld:false };

const player = {
  x: 60, y: 0, w: 30, h: 40,
  vx: 0, vy: 0,
  onGround: false,
  dir: 1,
  dead: false,
  score: 0,
  coins: 0,
  lives: CONFIG.PLAYER_LIVES,
  invincible: 0,
  hasFire: false,
  attackCooldown: 0,
};

let solids = [];   // 当たり判定つきの地形一覧
let enemies = [];
let coinList = [];
let fireballs = [];
let goalReached = false;

/* ---------------------------------------------------------------
   レベル初期化：LEVELのデータから当たり判定オブジェクトを組み立てる
--------------------------------------------------------------- */
function buildLevel(){
  solids = [];
  const gy = CONFIG.GROUND_Y;

  // 地面
  LEVEL.groundSegments.forEach(([x1,x2])=>{
    solids.push({ x:x1, y:gy, w:x2-x1, h: 200, type:'ground' });
  });

  // 土管
  LEVEL.pipes.forEach(p=>{
    solids.push({ x:p.x, y:gy-p.h, w:p.w, h:p.h+200, type:'pipe' });
  });

  // ブロック
  LEVEL.blocks.forEach(b=>{
    solids.push({ x:b.x, y:b.y, w:36, h:36, type:b.type, coin:b.coin, item: b.item || null, used:false, bounce:0 });
  });

  // 階段（登り→降り）
  const st = LEVEL.stairs;
  for(let i=0;i<st.steps;i++){
    const h = (i+1)*st.stepH;
    solids.push({ x: st.startX + i*st.stepW, y: gy-h, w: st.stepW, h: h+200, type:'ground' });
  }
  const peakX = st.startX + st.steps*st.stepW;
  for(let i=st.steps-1;i>=0;i--){
    const h = (i+1)*st.stepH;
    solids.push({ x: peakX + (st.steps-1-i)*st.stepW, y: gy-h, w: st.stepW, h: h+200, type:'ground' });
  }

  // 敵
  enemies = LEVEL.enemies.map(e=>({
    x:e.x, y:gy-28, w:28, h:28, vx:1.4, left:e.left, right:e.right, alive:true, squashT:0
  }));

  // コイン
  coinList = LEVEL.coins.map(c=>({ x:c.x, y:c.y, taken:false, t:Math.random()*Math.PI*2 }));
}

function resetPlayer(){
  player.x = 60; player.y = CONFIG.GROUND_Y - 80;
  player.vx = 0; player.vy = 0;
  player.dead = false; player.invincible = 0;
  player.onGround = false; player.dir = 1;
  camX = 0; shake = 0; elapsedTime = 0;
  goalReached = false;
  floatingTexts = [];
  player.hasFire = false;
  player.attackCooldown = 0;
  fireballs = [];
}

function fullReset(){
  player.score = 0; player.coins = 0; player.lives = CONFIG.PLAYER_LIVES;
  buildLevel();
  resetPlayer();
}

/* ---------------------------------------------------------------
   入力
--------------------------------------------------------------- */
window.addEventListener('keydown', e=>{
  if(['ArrowLeft','ArrowRight','ArrowUp',' '].includes(e.key)) e.preventDefault();
  if(e.key === 'ArrowLeft') input.left = true;
  if(e.key === 'ArrowRight') input.right = true;
  if(e.key === 'ArrowUp' || e.key === ' ') { input.jump = true; }
  if(e.key === 'Enter') {
    input.attack = true;
    // GAME OVER / STAGE CLEAR 画面では、Enterキーで「もういちど」ボタンを押したことにする
    if(state === 'dead' || state === 'clear'){ doRestart(); }
  }
  if(e.key === 'r' || e.key === 'R'){ if(state!=='playing') doRestart(); }
});
window.addEventListener('keyup', e=>{
  if(e.key === 'ArrowLeft') input.left = false;
  if(e.key === 'ArrowRight') input.right = false;
  if(e.key === 'ArrowUp' || e.key === ' '){ input.jump = false; input.jumpHeld = false; }
  if(e.key === 'Enter'){ input.attack = false; input.attackHeld = false; }
});

function bindHold(el, onDown, onUp){
  el.addEventListener('mousedown', e=>{ e.preventDefault(); onDown(); });
  el.addEventListener('mouseup', e=>{ onUp(); });
  el.addEventListener('mouseleave', ()=> onUp());
  el.addEventListener('touchstart', e=>{ e.preventDefault(); onDown(); }, {passive:false});
  el.addEventListener('touchend', e=>{ e.preventDefault(); onUp(); }, {passive:false});
}
bindHold(document.getElementById('btnLeft'), ()=>input.left=true, ()=>input.left=false);
bindHold(document.getElementById('btnRight'), ()=>input.right=true, ()=>input.right=false);
bindHold(document.getElementById('btnJump'), ()=>input.jump=true, ()=>{input.jump=false; input.jumpHeld=false;});

/* ---------------------------------------------------------------
   全画面表示ボタン（PC/スマホ共通）
   ・YouTubeのように、ボタン一つで全画面表示に切り替える。
   ・iOS Safariは「ブラウザ標準の全画面API(requestFullscreen)」が
     動画以外の要素には対応していないため、その方法だけに頼ると
     iPhoneでボタンが機能しなくなる。
   ・そのため「疑似全画面」を主な方式にする：このゲームはiframeで
     埋め込まれている前提なので、埋め込み元(event/index.html)へ
     postMessageで通知し、埋め込み元の側でiframe自体をCSSで画面
     いっぱい(position:fixed)に広げてもらう。これはOSの許可がいらず
     どのブラウザでも確実に効く。
   ・あわせて、対応している環境ではブラウザ標準の全画面API・画面回転
     ロックAPIも「ダメ元」で呼んでおく(使えれば、よりネイティブに近い
     全画面体験になる。使えなくても疑似全画面がフォールバックになる)。
   ・端末を回転できない場合(iOS等)は、下のCSS(@media (orientation:portrait))
     で画面自体を90度回転させ、横画面らしく見せる。
--------------------------------------------------------------- */
const fsBtn = document.getElementById('fsBtn');
let pseudoFullscreen = false;

function isFullscreenNow(){
  return !!(document.fullscreenElement || document.webkitFullscreenElement);
}
function notifyParentFullscreen(on){
  try{ window.parent.postMessage({ type:'shuku-dino-fullscreen', value: on }, '*'); }catch(err){}
}
function setPseudoFullscreen(on){
  pseudoFullscreen = on;
  document.documentElement.classList.toggle('pseudo-fullscreen', on);
  notifyParentFullscreen(on);
  syncFsBtnIcon();
  // 回転・全画面化のCSSが反映されるのを少し待ってから、ゲーム画面のサイズを再計算する
  if(window.__fitStageSize) setTimeout(window.__fitStageSize, 60);

  if(on){
    // ブラウザ標準のFullscreen APIが使える環境ではあわせて呼んでおく(失敗しても無視)
    const el = document.documentElement;
    try{
      const p = el.requestFullscreen ? el.requestFullscreen() : (el.webkitRequestFullscreen ? el.webkitRequestFullscreen() : null);
      if(p && p.catch) p.catch(()=>{});
    }catch(err){}
    try{
      if(screen.orientation && screen.orientation.lock) screen.orientation.lock('landscape').catch(()=>{});
    }catch(err){}
  } else {
    try{
      if(document.exitFullscreen) document.exitFullscreen().catch(()=>{});
      else if(document.webkitExitFullscreen) document.webkitExitFullscreen();
    }catch(err){}
    try{
      if(screen.orientation && screen.orientation.unlock) screen.orientation.unlock();
    }catch(err){}
  }
}
fsBtn.addEventListener('click', ()=> setPseudoFullscreen(!pseudoFullscreen));

function syncFsBtnIcon(){ fsBtn.textContent = pseudoFullscreen ? '⤡' : '⛶'; }
// ESCキー等でブラウザ標準の全画面だけが先に解除された場合は、疑似全画面側も合わせて解除する
document.addEventListener('fullscreenchange', ()=>{ if(!isFullscreenNow() && pseudoFullscreen) setPseudoFullscreen(false); });
document.addEventListener('webkitfullscreenchange', ()=>{ if(!isFullscreenNow() && pseudoFullscreen) setPseudoFullscreen(false); });

/* ---------------------------------------------------------------
   スマホ等タッチ端末むけの操作
   ・PC(マウス操作)ではこのブロックは何もしない。キーボード＋上のボタンのまま。
   ・タッチ主体端末(pointer:coarse)のときだけ、ボタンとヒントを隠し、
     代わりに以下を表示する。
       - 移動用の仮想スティック(左下)：押していないときも円が常に見える
         位置に置いておき、指を置くとその場所にスッと移動する。
         「最初に押した場所」を基準に左右どちらにずらしたかで移動方向を
         決めるので、画面のどこを押しても・どちらの方向にも確実に動かせる。
       - ジャンプ／ファイヤーブレス(右下)：色とアイコンをはっきり分けた
         専用ボタン。スワイプ判定に頼らず、押した瞬間に確実に反応する。
   ・canvasの上にはオーバーレイ(タイトル/ゲームオーバー/クリア画面)が重なって
     おり、表示中はオーバーレイがタッチを受け取る(canvasには届かない)ので、
     移動スティックが拾うタッチは常に「プレイ中の画面操作」だけになる。
--------------------------------------------------------------- */
const isTouchDevice = window.matchMedia('(hover: none) and (pointer: coarse)').matches;
let syncTouchControlsVisibility = null; // タッチ端末のときだけ中身が入る(下で代入)。毎フレーム呼び出す

if(isTouchDevice){
  // 幅640px超の横画面でもh1非表示・余白縮小が効くように、幅だけに頼らずクラスでも制御する
  document.documentElement.classList.add('touch-ui');

  document.getElementById('controls').classList.add('hidden');
  document.getElementById('hint').classList.add('hidden');
  // タッチ操作用UI(スティック/ジャンプ/ファイヤー)は、タイトル画面の間は隠しておき
  // スタートしてから表示する。実際の表示切り替えはloop()内のsyncTouchControlsVisibility()で行う。

  // タイトル画面の説明文を、キーボード操作前提の文言からタッチ操作向けに差し替える
  document.getElementById('titleHint').innerHTML =
    '左下のスティックで うごく　　右下の⤴でジャンプ<br>' +
    '🔥でファイヤーブレス！　てきの宇宙人をふんでやっつけろ！　たまごの巣にタッチでゴール！';

  bindHold(document.getElementById('btnJumpTouch'), ()=>input.jump=true, ()=>{input.jump=false; input.jumpHeld=false;});
  bindHold(document.getElementById('btnFireTouch'), ()=>input.attack=true, ()=>{input.attack=false; input.attackHeld=false;});

  const stickZone = document.getElementById('touchStickZone');
  const stickKnob = document.querySelector('#touchStick .knob');
  const STICK_DEADZONE = 12; // px。これ未満のズレは「動かしていない」扱い
  const STICK_MAX = 18;      // px。スティックの見た目上の可動範囲

  let moveTouchId = null, moveStartX = 0, moveStartY = 0;

  function moveStickKnob(dx, dy){
    const dist = Math.min(STICK_MAX, Math.hypot(dx, dy));
    const ang = Math.atan2(dy, dx);
    stickKnob.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px)`;
  }
  function resetStickKnob(){ stickKnob.style.transform = ''; }

  stickZone.addEventListener('touchstart', e=>{
    e.preventDefault();
    if(moveTouchId !== null) return; // 既に1本追跡中なら無視(2本目以降は無効)
    const t = e.changedTouches[0];
    moveTouchId = t.identifier;
    moveStartX = t.clientX; moveStartY = t.clientY;
    resetStickKnob();
  }, {passive:false});

  stickZone.addEventListener('touchmove', e=>{
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier === moveTouchId){
        const dx = t.clientX - moveStartX;
        const dy = t.clientY - moveStartY;
        moveStickKnob(dx, dy);
        input.left = dx < -STICK_DEADZONE;
        input.right = dx > STICK_DEADZONE;
      }
    }
  }, {passive:false});

  function endStickTouch(e){
    e.preventDefault();
    for(const t of e.changedTouches){
      if(t.identifier === moveTouchId){
        moveTouchId = null;
        input.left = false; input.right = false;
        resetStickKnob();
      }
    }
  }
  stickZone.addEventListener('touchend', endStickTouch, {passive:false});
  stickZone.addEventListener('touchcancel', endStickTouch, {passive:false});

  /* ---------------------------------------------------------------
     ゲーム画面(#stage)の大きさを、幅だけでなく「高さ」の制約も
     考慮して動的に計算する。
     横画面(全画面時のCSS回転含む)では、幅基準でstageサイズを決めると
     高さが画面をはみ出し、下の操作バーが見えなくなってしまうため、
     幅と高さ両方の制約のうち小さい方に合わせてstageの幅を決める。
  --------------------------------------------------------------- */
  const BAR_H = 96; // #touchControlsBarの高さ(CSSの値と合わせること)

  function fitStageSize(){
    // 全画面(疑似含む)かつ縦向きビューポートのときは、CSSで90度回転しているので
    // 実際に使える幅と高さが入れ替わる
    const rotated = document.documentElement.classList.contains('pseudo-fullscreen')
      && window.matchMedia('(orientation:portrait)').matches;
    let availW = document.body.clientWidth;
    let availH = document.body.clientHeight;
    if(rotated){ const t = availW; availW = availH; availH = t; }

    const barVisible = !document.getElementById('touchControlsBar').classList.contains('hidden');
    const barH = barVisible ? BAR_H : 0;
    const usableH = Math.max(120, availH - barH - 24); // #appのpadding/gap分をおおまかに差し引く(安全側に少し多めに)
    const usableW = Math.max(200, availW - 16);

    const widthFromHeight = usableH * (960 / 540);
    const finalWidth = Math.min(usableW, widthFromHeight, 960);
    document.getElementById('stage').style.width = finalWidth + 'px';
  }

  fitStageSize();
  window.addEventListener('resize', fitStageSize);
  window.addEventListener('orientationchange', ()=> setTimeout(fitStageSize, 120));
  window.__fitStageSize = fitStageSize; // 全画面切り替え側(setPseudoFullscreen)から再計算できるように

  // プレイ中(state==='playing')だけ操作バーを表示し、
  // ファイヤーボタンはさらに「ファイヤーブレスを取得した後(player.hasFire)」だけ表示する。
  // 状態が毎フレーム変わりうるので、メインループから毎フレーム呼び出して同期する。
  let lastBarVisible = null;
  syncTouchControlsVisibility = function(){
    const playing = (state === 'playing');
    document.getElementById('touchControlsBar').classList.toggle('hidden', !playing);
    document.getElementById('btnFireTouch').classList.toggle('hidden', !player.hasFire);
    if(playing !== lastBarVisible){
      lastBarVisible = playing;
      fitStageSize(); // バーの表示有無でstageの使える高さが変わるため再計算する
    }
  };
}

/* ---------------------------------------------------------------
   AABB当たり判定ヘルパー
--------------------------------------------------------------- */
function rectsOverlap(a,b){
  return a.x < b.x+b.w && a.x+a.w > b.x && a.y < b.y+b.h && a.y+a.h > b.y;
}

function moveAndCollide(ent){
  // X軸移動＆解決
  ent.x += ent.vx;
  for(const s of solids){
    if(!rectsOverlap(ent, s)) continue;
    if(ent.vx > 0) ent.x = s.x - ent.w;
    else if(ent.vx < 0) ent.x = s.x + s.w;
    ent.vx = 0;
  }
  // Y軸移動＆解決
  ent.y += ent.vy;
  ent.onGround = false;
  for(const s of solids){
    if(!rectsOverlap(ent, s)) continue;
    if(ent.vy > 0){
      ent.y = s.y - ent.h;
      ent.vy = 0; ent.onGround = true;
    } else if(ent.vy < 0){
      ent.y = s.y + s.h;
      ent.vy = 0;
      onHitBlockFromBelow(s);
    }
  }
}

function onHitBlockFromBelow(block){
  if(block.type !== 'question' && block.type !== 'brick') return;
  block.bounce = 6;
  if(block.type === 'question' && !block.used){
    block.used = true;
    if(block.item === 'fire'){
      player.hasFire = true;
      spawnFloatText(block.x+18, block.y-6, 'FIRE UP!', COLORS.playerFire);
      sfx.fire();
    } else {
      player.score += 100; player.coins += 1;
      spawnFloatText(block.x+18, block.y-6, '+100', COLORS.coin);
      sfx.coin();
    }
  } else {
    sfx.bump();
  }
}

function spawnFloatText(x,y,text,color){
  floatingTexts.push({ x, y, text, color, life: 45 });
}

/* ---------------------------------------------------------------
   更新処理
--------------------------------------------------------------- */
function update(dt){
  if(state !== 'playing') return;

  elapsedTime += dt;
  const timeLeft = Math.max(0, CONFIG.TIME_LIMIT - elapsedTime);
  if(timeLeft <= 0 && !player.dead){ killPlayer(); }

  if(!player.dead && !goalReached){
    // 横移動
    if(input.left){ player.vx -= CONFIG.MOVE_ACCEL; player.dir = -1; }
    else if(input.right){ player.vx += CONFIG.MOVE_ACCEL; player.dir = 1; }
    else { player.vx *= CONFIG.FRICTION; if(Math.abs(player.vx) < 0.05) player.vx = 0; }
    player.vx = Math.max(-CONFIG.MOVE_MAX, Math.min(CONFIG.MOVE_MAX, player.vx));

    // ジャンプ
    if(input.jump && player.onGround && !input.jumpHeld){
      player.vy = -CONFIG.JUMP_POWER;
      player.onGround = false;
      input.jumpHeld = true;
      sfx.jump();
    }

    // 重力
    player.vy += CONFIG.GRAVITY;
    if(player.vy > CONFIG.MAX_FALL_SPEED) player.vy = CONFIG.MAX_FALL_SPEED;

    moveAndCollide(player);

    // 穴に落ちた
    if(player.y > VH + 100){ killPlayer(); }

    // 攻撃（口からファイヤーブレス！ 頭の先＝口の位置から炎を吐く）
    if(input.attack && !input.attackHeld && player.hasFire && player.attackCooldown <= 0){
      const mouthX = player.x + player.w/2 + player.dir * (player.w/2 + 2);
      const mouthY = player.y + 6; // 頭のあたりの高さ
      for(let i=0;i<4;i++){
        fireballs.push({
          x: mouthX, y: mouthY,
          vx: player.dir * (7 + Math.random()*2),
          vy: (Math.random()-0.5)*1.2,
          r: 7 + Math.random()*3,
          life: 22 + i*4,
        });
      }
      player.attackCooldown = 0.25;
      input.attackHeld = true;
      sfx.fire();
    }

    // コイン取得
    coinList.forEach(c=>{
      if(c.taken) return;
      const cb = { x:c.x-10, y:c.y-10, w:20, h:20 };
      if(rectsOverlap(player, cb)){
        c.taken = true; player.score += 100; player.coins += 1;
        spawnFloatText(c.x, c.y-10, '+100', COLORS.coin);
        sfx.coin();
      }
    });

    // 敵との当たり判定
    enemies.forEach(en=>{
      if(!en.alive) return;
      if(!rectsOverlap(player, en)) return;
      const stomp = player.vy > 0 && (player.y + player.h) - en.y < 18;
      if(stomp){
        en.alive = false; en.squashT = 20;
        player.vy = -8;
        player.score += 200;
        spawnFloatText(en.x+10, en.y-6, '+200', '#fff');
        sfx.stomp();
      } else if(player.invincible <= 0){
        killPlayer();
      }
    });

    // ゴール判定
    if(player.x + player.w > LEVEL.flagX){
      goalReached = true;
      const gy = CONFIG.GROUND_Y;
      const touchHeight = gy - player.y; // 高いところで触れるほどボーナス
      const bonus = Math.max(500, Math.min(5000, Math.round(touchHeight*8)));
      player.score += bonus + Math.round(timeLeft)*10;
      sfx.clear();
      setTimeout(()=> showClear(), 600);
    }
  }

  if(player.invincible > 0) player.invincible -= dt;
  if(player.attackCooldown > 0) player.attackCooldown -= dt;

  fireballs = fireballs.filter(f=>{
    f.x += f.vx;
    f.y += (f.vy||0);
    f.life -= dt * 60;
    const fired = { x: f.x-f.r, y: f.y-f.r, w: f.r*2, h: f.r*2 };
    if(f.x < 0 || f.x > CONFIG.WORLD_WIDTH || f.life <= 0) return false;
    for(const s of solids){
      if(s.type === 'ground' || s.type === 'pipe'){
        if(rectsOverlap(fired, s)) return false;
      }
    }
    let alive = true;
    enemies.forEach(en=>{
      if(!en.alive) return;
      if(rectsOverlap(fired, en)){
        en.alive = false; en.squashT = 20;
        player.score += 200;
        spawnFloatText(en.x+10, en.y-6, '+200', '#fff');
        sfx.stomp();
        alive = false;
      }
    });
    return alive;
  });

  // 敵の移動
  enemies.forEach(en=>{
    if(!en.alive){
      if(en.squashT > 0) en.squashT -= dt*60;
      return;
    }
    en.x += en.vx;
    if(en.x < en.left){ en.x = en.left; en.vx *= -1; }
    if(en.x > en.right){ en.x = en.right; en.vx *= -1; }
  });

  // ブロックのバウンドアニメ減衰
  solids.forEach(s=>{ if(s.bounce>0) s.bounce -= dt*60; });

  // 浮遊テキスト更新
  floatingTexts.forEach(f=>{ f.y -= 0.6; f.life -= 1; });
  floatingTexts = floatingTexts.filter(f=>f.life>0);

  // カメラ追従
  const targetCam = Math.max(0, Math.min(LEVEL.WORLD_WIDTH_CACHE || (CONFIG.WORLD_WIDTH-VW), player.x - VW*0.4));
  camX += (targetCam - camX) * 0.15;
  if(shake>0) shake -= dt*60;
}

function killPlayer(){
  if(player.dead) return;
  player.dead = true;
  player.vy = -10;
  player.lives -= 1;
  shake = 12;
  sfx.die();
  setTimeout(()=> showDead(), 900);
}

/* ---------------------------------------------------------------
   描画処理
--------------------------------------------------------------- */
function draw(){
  ctx.clearRect(0,0,VW,VH);

  const sx = shake>0 ? (Math.random()-0.5)*shake : 0;
  const sy = shake>0 ? (Math.random()-0.5)*shake : 0;
  ctx.save();
  ctx.translate(sx, sy);

  drawSky();
  drawParallaxHills();

  ctx.save();
  ctx.translate(-camX, 0);
  drawSolids();
  drawCoins();
  drawEnemies();
  drawFireballs();
  drawFlag();
  drawPlayer();
  drawFloatingTexts();
  ctx.restore();

  drawHUD();
  ctx.restore();
}

function drawSky(){
  const g = ctx.createLinearGradient(0,0,0,VH);
  g.addColorStop(0, COLORS.skyTop);
  g.addColorStop(1, COLORS.skyBottom);
  ctx.fillStyle = g;
  ctx.fillRect(0,0,VW,VH);

  // 雲(視差)
  ctx.fillStyle = COLORS.cloud;
  for(let i=0;i<6;i++){
    const cx = ((i*420) - camX*0.3) % (VW+400) - 200;
    drawCloud(cx, 60 + (i%3)*30);
  }
}
function drawCloud(x,y){
  ctx.beginPath();
  ctx.ellipse(x,y,26,16,0,0,Math.PI*2);
  ctx.ellipse(x+22,y+4,20,14,0,0,Math.PI*2);
  ctx.ellipse(x-22,y+6,18,12,0,0,Math.PI*2);
  ctx.fill();
}

function drawParallaxHills(){
  // 遠景：噴煙をあげる火山（一番奥・動きがいちばんゆっくり）
  drawVolcano(((VW*0.7) - camX*0.15) % (VW+600) - 300);
  drawVolcano(((VW*2.4) - camX*0.15) % (VW+600) - 300);

  // 中景：ジャングルの丘（緑のもこもこしたシルエット）
  ctx.fillStyle = COLORS.hillDark;
  for(let i=0;i<5;i++){
    const bx = ((i*300) - camX*0.5) % (VW+300) - 150;
    ctx.beginPath();
    ctx.arc(bx, CONFIG.GROUND_Y+40, 110, Math.PI, 0);
    ctx.fill();
  }
  ctx.fillStyle = COLORS.hill;
  for(let i=0;i<5;i++){
    const bx = ((i*300+150) - camX*0.5) % (VW+300) - 150;
    ctx.beginPath();
    ctx.arc(bx, CONFIG.GROUND_Y+55, 80, Math.PI, 0);
    ctx.fill();
  }
}

function drawVolcano(bx){
  const baseY = CONFIG.GROUND_Y - 60;
  const topY = baseY - 150;
  ctx.fillStyle = COLORS.volcanoDark;
  ctx.beginPath();
  ctx.moveTo(bx-140, baseY);
  ctx.lineTo(bx-24, topY);
  ctx.lineTo(bx+24, topY);
  ctx.lineTo(bx+140, baseY);
  ctx.closePath();
  ctx.fill();
  // 山肌のハイライト
  ctx.fillStyle = COLORS.volcano;
  ctx.beginPath();
  ctx.moveTo(bx-100, baseY);
  ctx.lineTo(bx-16, topY+10);
  ctx.lineTo(bx+8, topY+10);
  ctx.lineTo(bx+70, baseY);
  ctx.closePath();
  ctx.fill();
  // 噴火口の溶岩の光
  ctx.fillStyle = COLORS.lava;
  ctx.beginPath();
  ctx.ellipse(bx, topY+6, 20, 8, 0, 0, Math.PI*2);
  ctx.fill();
  // ゆらゆら上がる噴煙
  const t = performance.now()*0.0006;
  ctx.fillStyle = 'rgba(90,80,70,0.35)';
  for(let i=0;i<3;i++){
    const puff = (t*40 + i*30) % 90;
    ctx.beginPath();
    ctx.ellipse(bx + Math.sin(t+i)*10, topY - 10 - puff, 14+i*4, 10+i*3, 0, 0, Math.PI*2);
    ctx.fill();
  }
}

function drawBoneIcon(cx, cy, size){
  // 「ほね」アイコン：真ん中の棒＋両端の2つずつのこぶ、という定番の骨シルエット
  const barW = size*0.46, barH = size*0.24, knob = size*0.24;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.fillStyle = '#fdf6e8';
  ctx.strokeStyle = '#b89a6e'; ctx.lineWidth = 1.4;
  ctx.fillRect(-barW/2, -barH/2, barW, barH);
  ctx.strokeRect(-barW/2, -barH/2, barW, barH);
  [-1,1].forEach(side=>{
    [-1,1].forEach(v=>{
      ctx.beginPath();
      ctx.arc(side*barW/2, v*knob*0.55, knob*0.55, 0, Math.PI*2);
      ctx.fill();
      ctx.stroke();
    });
  });
  ctx.restore();
}

function drawSolids(){
  solids.forEach(s=>{
    if(s.x + s.w < camX-40 || s.x > camX+VW+40) return; // 画面外は描かない
    const bounceY = s.bounce>0 ? -Math.min(6, s.bounce) : 0;
    if(s.type === 'ground'){
      ctx.fillStyle = COLORS.ground;
      ctx.fillRect(s.x, s.y, s.w, 40);
      ctx.fillStyle = COLORS.groundTop;
      ctx.fillRect(s.x, s.y, s.w, 8);
    } else if(s.type === 'pipe'){
      // ジャングルの「うつろな丸太」（当たり判定は元の土管と同じ形のまま）
      ctx.fillStyle = COLORS.pipeDark;
      ctx.fillRect(s.x, s.y, s.w, s.h);
      ctx.fillStyle = COLORS.pipe;
      ctx.fillRect(s.x+4, s.y+4, s.w-8, s.h-4);
      // 年輪（切り株っぽい模様）を上端に
      ctx.strokeStyle = COLORS.pipeDark; ctx.lineWidth=2;
      ctx.beginPath();
      ctx.ellipse(s.x+s.w/2, s.y+4, s.w/2-6, 6, 0, 0, Math.PI*2);
      ctx.ellipse(s.x+s.w/2, s.y+4, s.w/2-16, 3.5, 0, 0, Math.PI*2);
      ctx.stroke();
      // 幹の縦すじ
      ctx.strokeStyle = 'rgba(0,0,0,0.15)'; ctx.lineWidth=2;
      for(let lx = s.x+14; lx < s.x+s.w-8; lx += 14){
        ctx.beginPath(); ctx.moveTo(lx, s.y+14); ctx.lineTo(lx, s.y+s.h); ctx.stroke();
      }
    } else if(s.type === 'brick'){
      // 苔むした岩ブロック
      ctx.fillStyle = COLORS.block;
      ctx.fillRect(s.x, s.y+bounceY, s.w, s.h);
      ctx.strokeStyle = COLORS.blockLine; ctx.lineWidth=2;
      ctx.strokeRect(s.x+1, s.y+bounceY+1, s.w-2, s.h-2);
      ctx.beginPath();
      ctx.moveTo(s.x, s.y+bounceY+s.h/2); ctx.lineTo(s.x+s.w, s.y+bounceY+s.h/2);
      ctx.stroke();
      ctx.fillStyle = COLORS.groundTop;
      ctx.fillRect(s.x+3, s.y+bounceY+2, s.w-6, 4);
    } else if(s.type === 'question'){
      // ほねブロック：中に「ほね」が入っていて、たたくとアイテムが出てくる。
      // 恐竜が好きな「ほね」を箱の中に描くことで、何が出るブロックか一目でわかるようにしている。
      ctx.fillStyle = s.used ? COLORS.questionUsed : COLORS.question;
      ctx.fillRect(s.x, s.y+bounceY, s.w, s.h);
      ctx.strokeStyle = COLORS.blockLine; ctx.lineWidth=2;
      ctx.strokeRect(s.x+1, s.y+bounceY+1, s.w-2, s.h-2);
      if(!s.used){
        drawBoneIcon(s.x+s.w/2, s.y+bounceY+s.h/2, s.w*0.62);
      }
    }
  });
}

function drawCoins(){
  // 集める「にく」。恐竜の大好物！（内部の変数名は coin のままだが見た目は肉）
  coinList.forEach(c=>{
    if(c.taken) return;
    if(c.x < camX-40 || c.x > camX+VW+40) return;
    c.t += 0.08;
    const bob = Math.sin(c.t)*2.5;
    drawMeat(c.x, c.y+bob, 12);
  });
}

function drawMeat(cx, cy, size){
  ctx.save();
  ctx.translate(cx, cy);
  // お肉の身（ぷっくりしたお肉の形）
  ctx.fillStyle = '#c96a4b';
  ctx.beginPath();
  ctx.ellipse(0, -size*0.18, size*0.62, size*0.5, -0.2, 0, Math.PI*2);
  ctx.fill();
  ctx.strokeStyle = '#7a3d28'; ctx.lineWidth = 1.4;
  ctx.stroke();
  // ハイライト（つやっと感）
  ctx.fillStyle = 'rgba(255,255,255,0.3)';
  ctx.beginPath();
  ctx.ellipse(-size*0.18, -size*0.38, size*0.2, size*0.11, -0.3, 0, Math.PI*2);
  ctx.fill();
  // 骨の持ち手
  ctx.fillStyle = '#fdf6e8';
  ctx.strokeStyle = '#c9a876'; ctx.lineWidth = 1.2;
  ctx.beginPath();
  ctx.moveTo(size*0.12, size*0.12);
  ctx.lineTo(size*0.5, size*0.6);
  ctx.lineTo(size*0.36, size*0.72);
  ctx.lineTo(-size*0.02, size*0.24);
  ctx.closePath();
  ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(size*0.54, size*0.58, size*0.14, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.beginPath(); ctx.arc(size*0.4, size*0.76, size*0.12, 0, Math.PI*2); ctx.fill(); ctx.stroke();
  ctx.restore();
}

function drawEnemies(){
  // てきは「ちょっとかわいい宇宙人」。まんまるの頭に大きな目、
  // ぷるぷる浮遊するアンテナが特徴（怖すぎないデザインにしている）
  enemies.forEach(en=>{
    if(en.x < camX-40 || en.x > camX+VW+40) return;
    ctx.save();
    if(!en.alive){
      if(en.squashT <= 0) { ctx.restore(); return; }
      ctx.translate(en.x, en.y+en.h-8);
      ctx.scale(1, 0.3);
      ctx.fillStyle = COLORS.enemy;
      ctx.beginPath();
      ctx.ellipse(0, 0, en.w/2, en.h/2, 0, 0, Math.PI*2);
      ctx.fill();
      ctx.restore();
      return;
    }
    const bob = Math.sin(en.x*0.12)*3; // ふわふわ浮遊するような上下動
    const cx = en.x + en.w/2, cy = en.y + en.h/2 + bob;
    const eyeDir = en.vx > 0 ? 1 : -1;

    // アンテナ（先端が丸くぷるぷる光る）
    ctx.strokeStyle = COLORS.enemy; ctx.lineWidth = 2.5;
    ctx.beginPath(); ctx.moveTo(cx, cy - en.h*0.45); ctx.lineTo(cx, cy - en.h*0.75); ctx.stroke();
    ctx.fillStyle = COLORS.coin;
    ctx.beginPath(); ctx.arc(cx, cy - en.h*0.78, 3.5, 0, Math.PI*2); ctx.fill();

    // まんまるの頭（宇宙人ボディ）
    ctx.fillStyle = COLORS.enemy;
    ctx.beginPath();
    ctx.ellipse(cx, cy, en.w/2, en.h/2, 0, 0, Math.PI*2);
    ctx.fill();

    // ほっぺの赤み（愛嬌づけ）
    ctx.fillStyle = 'rgba(255,140,140,0.55)';
    ctx.beginPath(); ctx.arc(cx - en.w*0.32, cy + en.h*0.12, 3.5, 0, Math.PI*2); ctx.fill();
    ctx.beginPath(); ctx.arc(cx + en.w*0.32, cy + en.h*0.12, 3.5, 0, Math.PI*2); ctx.fill();

    // 大きな目（進行方向をキョロっと見る）
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.ellipse(cx + eyeDir*4, cy - en.h*0.05, 6, 7, 0, 0, Math.PI*2);
    ctx.ellipse(cx - eyeDir*6, cy - en.h*0.05, 5, 6, 0, 0, Math.PI*2);
    ctx.fill();
    ctx.fillStyle = '#241b1b';
    ctx.beginPath();
    ctx.arc(cx + eyeDir*5.5, cy - en.h*0.02, 2.4, 0, Math.PI*2);
    ctx.arc(cx - eyeDir*4.5, cy - en.h*0.02, 2, 0, Math.PI*2);
    ctx.fill();
    // 目のハイライト（キラッと感）
    ctx.fillStyle = '#fff';
    ctx.beginPath();
    ctx.arc(cx + eyeDir*6.3, cy - en.h*0.13, 0.9, 0, Math.PI*2);
    ctx.fill();

    // にこっとした口
    ctx.strokeStyle = '#241b1b'; ctx.lineWidth = 1.6;
    ctx.beginPath();
    ctx.arc(cx, cy + en.h*0.2, 4, 0.15*Math.PI, 0.85*Math.PI);
    ctx.stroke();

    ctx.restore();
  });
}

function drawFlag(){
  // ゴールは「光る恐竜のたまご」。木の棒の先に小枝の巣を組み、
  // その上でたまごがふわふわ光りながらゆれている。
  const gy = CONFIG.GROUND_Y;
  const topY = 150;
  if(LEVEL.flagX < camX-60 || LEVEL.flagX > camX+VW+60) return;
  const poleX = LEVEL.flagX + 10;
  ctx.fillStyle = COLORS.goalPole;
  ctx.fillRect(poleX, topY, 4, gy-topY);
  const orbY = goalReached ? gy - 20 : topY;
  const t = performance.now()*0.004;
  const pulse = 1 + Math.sin(t)*0.08;
  ctx.save();
  ctx.translate(poleX+2, orbY);
  ctx.rotate(goalReached ? Math.sin(t)*0.15 : Math.sin(t*0.5)*0.08);

  // 小枝の巣
  ctx.strokeStyle = COLORS.pipeDark; ctx.lineWidth = 2;
  ctx.beginPath();
  for(let i=-2;i<=2;i++){ ctx.moveTo(i*7, 11); ctx.lineTo(i*4, -1); }
  ctx.stroke();

  // 光るたまご
  ctx.fillStyle = COLORS.goalCore;
  ctx.shadowColor = COLORS.goalCore;
  ctx.shadowBlur = 16;
  ctx.beginPath();
  ctx.ellipse(0, -8, 10*pulse, 13*pulse, 0, 0, Math.PI*2);
  ctx.fill();

  // たまごの模様
  ctx.shadowBlur = 0;
  ctx.strokeStyle = 'rgba(139,90,20,0.5)'; ctx.lineWidth = 1.5;
  ctx.beginPath(); ctx.ellipse(-3,-12,3,2,0.3,0,Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.ellipse(4,-4,2.5,1.8,-0.4,0,Math.PI*2); ctx.stroke();
  ctx.restore();
}

function roundRectPath(x,y,w,h,r){
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}

function drawPlayer(){
  // プレイヤーは「小さな恐竜」。しっぽ・背中のトゲ・まん丸の鼻先が特徴。
  // ファイヤーを吸い込んでいる間（hasFire）は体の色がオレンジ寄りに変わる。
  if(player.invincible > 0 && Math.floor(player.invincible*10)%2===0) return; // 点滅
  ctx.save();
  ctx.translate(player.x + player.w/2, player.y + player.h/2);
  if(player.dead) ctx.rotate(0.3*player.dir);
  ctx.scale(player.dir, 1);

  const bodyColor = player.hasFire ? COLORS.playerFire : COLORS.player;
  const darkColor = player.hasFire ? COLORS.playerFireCap : COLORS.playerCap;
  const bob = player.onGround ? Math.sin(performance.now()*0.02)*1.2 : 0;

  // しっぽ
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.moveTo(-8, 4+bob);
  ctx.lineTo(-19, 9);
  ctx.lineTo(-8, 14+bob);
  ctx.closePath();
  ctx.fill();

  // 足
  ctx.fillStyle = darkColor;
  ctx.fillRect(-6, 17, 6, 5);
  ctx.fillRect(4, 17, 6, 5);

  // 胴体
  ctx.fillStyle = bodyColor;
  roundRectPath(-10, -6, 20, 24, 6);
  ctx.fill();

  // おなか（明るいパッチ）
  ctx.fillStyle = COLORS.playerSkin;
  ctx.beginPath();
  ctx.ellipse(-1, 10, 6.5, 8, 0, 0, Math.PI*2);
  ctx.fill();

  // 背中のトゲトゲ
  ctx.fillStyle = darkColor;
  for(let i=0;i<3;i++){
    const bx = -7 + i*7;
    ctx.beginPath();
    ctx.moveTo(bx, -6);
    ctx.lineTo(bx+3.5, -14);
    ctx.lineTo(bx+7, -6);
    ctx.closePath();
    ctx.fill();
  }

  // 頭（丸くて、鼻先が前にちょこんと出ている）
  ctx.fillStyle = bodyColor;
  ctx.beginPath();
  ctx.ellipse(8, -6, 9, 8, 0, 0, Math.PI*2);
  ctx.fill();
  ctx.beginPath();
  ctx.ellipse(15, -3, 5, 4.3, 0, 0, Math.PI*2);
  ctx.fill();

  // 目
  ctx.fillStyle = '#fff';
  ctx.beginPath(); ctx.arc(9, -9, 3, 0, Math.PI*2); ctx.fill();
  ctx.fillStyle = '#1a1a1a';
  ctx.beginPath(); ctx.arc(10, -9, 1.4, 0, Math.PI*2); ctx.fill();

  // 鼻の穴
  ctx.fillStyle = darkColor;
  ctx.beginPath(); ctx.arc(18, -4, 1, 0, Math.PI*2); ctx.fill();

  ctx.restore();
}

function drawFlameShape(dir, size){
  ctx.beginPath();
  ctx.moveTo(dir*size*1.4, 0);
  ctx.quadraticCurveTo(dir*size*0.2, -size*0.9, -dir*size*0.6, -size*0.3);
  ctx.quadraticCurveTo(-dir*size*0.9, 0, -dir*size*0.6, size*0.3);
  ctx.quadraticCurveTo(dir*size*0.2, size*0.9, dir*size*1.4, 0);
  ctx.closePath();
}

function drawFireballs(){
  // 恐竜が吐いた「ファイヤーブレス」。赤→オレンジ→黄色の3重の炎で、
  // ちらちらと揺らめくアニメーションをつける。
  fireballs.forEach(f=>{
    if(f.x < camX-40 || f.x > camX+VW+40) return;
    const flicker = 0.82 + Math.sin(f.life*0.9 + f.x*0.3)*0.18;
    const dir = f.vx >= 0 ? 1 : -1;
    ctx.save();
    ctx.translate(f.x, f.y);
    ctx.fillStyle = '#ff4d2e';
    drawFlameShape(dir, f.r*1.15*flicker); ctx.fill();
    ctx.fillStyle = '#ff9a3c';
    drawFlameShape(dir, f.r*0.75*flicker); ctx.fill();
    ctx.fillStyle = '#ffe066';
    drawFlameShape(dir, f.r*0.4*flicker); ctx.fill();
    ctx.restore();
  });
}

function drawFloatingTexts(){
  ctx.textAlign = 'center';
  ctx.font = 'bold 14px monospace';
  floatingTexts.forEach(f=>{
    ctx.globalAlpha = Math.max(0, f.life/45);
    ctx.fillStyle = f.color;
    ctx.fillText(f.text, f.x, f.y);
  });
  ctx.globalAlpha = 1;
}

function drawHUD(){
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 15px monospace';
  ctx.textAlign = 'left';
  ctx.fillText('SCORE', 20, 24);
  ctx.fillText(String(player.score).padStart(6,'0'), 20, 42);

  ctx.fillText('MEAT', 180, 24);
  ctx.fillText('x' + String(player.coins).padStart(2,'0'), 180, 42);

  ctx.fillText('TIME', 320, 24);
  const timeLeft = Math.max(0, Math.ceil(CONFIG.TIME_LIMIT - elapsedTime));
  ctx.fillText(String(timeLeft).padStart(3,'0'), 320, 42);

  ctx.textAlign = 'right';
  ctx.fillText('LIVES x' + player.lives, VW-20, 24);
}

/* ---------------------------------------------------------------
   画面遷移
--------------------------------------------------------------- */
const titleScreen = document.getElementById('titleScreen');
const deadScreen = document.getElementById('deadScreen');
const clearScreen = document.getElementById('clearScreen');

function showTitle(){ state='title'; titleScreen.classList.remove('hidden'); deadScreen.classList.add('hidden'); clearScreen.classList.add('hidden'); }
function hideAllOverlays(){ titleScreen.classList.add('hidden'); deadScreen.classList.add('hidden'); clearScreen.classList.add('hidden'); }

function showDead(){
  state = 'dead';
  document.getElementById('deadScore').textContent = `SCORE: ${player.score}　のこりライフ: ${player.lives}`;
  deadScreen.classList.remove('hidden');
}
function showClear(){
  state = 'clear';
  // 公式サイト版はスコア・ランキングの記録は行わず、ゴールした事実だけを伝える
  document.getElementById('clearScore').textContent = 'ゴールクリア！🎉';
  clearScreen.classList.remove('hidden');
}

document.getElementById('startBtn').addEventListener('click', ()=>{
  if(!audioCtx) audioCtx = new (window.AudioContext||window.webkitAudioContext)();
  fullReset();
  hideAllOverlays();
  state = 'playing';
});
document.getElementById('retryBtn').addEventListener('click', doRestart);
document.getElementById('againBtn').addEventListener('click', doRestart);

function doRestart(){
  if(player.lives <= 0 || state === 'clear'){
    fullReset();
  } else {
    buildLevel();
    resetPlayer();
  }
  hideAllOverlays();
  state = 'playing';
}

/* ---------------------------------------------------------------
   メインループ
--------------------------------------------------------------- */
function loop(ts){
  if(!lastTimestamp) lastTimestamp = ts;
  let dt = (ts - lastTimestamp) / 1000;
  lastTimestamp = ts;
  dt = Math.min(dt, 1/30); // 大きすぎるdtを防ぐ

  update(dt);
  draw();
  if(syncTouchControlsVisibility) syncTouchControlsVisibility();
  requestAnimationFrame(loop);
}

buildLevel();
resetPlayer();
showTitle();
requestAnimationFrame(loop);
</script>
